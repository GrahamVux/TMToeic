<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MR. MINH TOEIC — Cổng học viên nội bộ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div role="status" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,rgba(185,228,236,.7),transparent 42%),radial-gradient(circle at bottom left,rgba(232,246,249,.95),transparent 40%),#f7fbfd;color:#1e333c;font-family:Inter,ui-sans-serif,system-ui,sans-serif;text-align:center">
        <div>
          <div style="width:96px;height:96px;margin:0 auto;display:grid;place-items:center;position:relative">
            <span style="position:absolute;inset:0;border-radius:999px;border:2px solid #b9e4ec;border-top-color:#2b8a9c;animation:toeic-spin 1.1s linear infinite"></span>
            <img src="/logo.png" alt="" width="64" height="64" style="width:64px;height:64px;border-radius:999px;background:#fff;object-fit:contain;box-shadow:0 8px 28px rgba(43,138,156,.22)" />
          </div>
          <p style="margin:24px 0 0;font-size:18px;font-weight:700;letter-spacing:-.02em">MR. MINH TOEIC</p>
          <p style="margin:6px 0 0;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#2b8a9c">Lớp học nội bộ</p>
          <p style="margin:24px 0 0;font-size:14px;color:rgba(30,51,60,.55)">Đang mở cổng học viên…</p>
        </div>
      </div>
      <style>
        @keyframes toeic-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
